name: CI

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sejm
          POSTGRES_PASSWORD: sejm
          POSTGRES_DB: sejmwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sejm -d sejmwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only
      DATABASE_URL: postgres://sejm:sejm@localhost:5432/sejmwatch
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q -m "not ocr"
