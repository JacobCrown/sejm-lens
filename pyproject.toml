[project]
name = "sejm-watch"
version = "0.1.0"
description = "Przejrzysty podgląd Sejmu RP: głosowania, posłowie i ich oświadczenia majątkowe"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.17.0",
    "django>=5.1,<5.3",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pypdfium2>=5.14.0",
    "whitenoise>=6.12.0",
]

[project.optional-dependencies]
ocr = [
    "chandra-ocr[hf]>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "ocr: needs the Chandra extra; omitted from GitHub CI",
]
