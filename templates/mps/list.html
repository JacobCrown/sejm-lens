{% extends "base.html" %}
{% block title %}Posłowie{% endblock %}
{% block content %}
<h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Posłowie</h1>
<p class="mt-1 text-slate-500">Znajdź posła po nazwisku, klubie albo okręgu wyborczym.</p>

<form class="mt-6 grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-[1fr_12rem_14rem_auto] md:items-center"
      hx-get="{% url 'mp_list' %}" hx-target="#results" hx-push-url="true"
      hx-trigger="input changed delay:300ms from:input[name=q], change, submit">
  <label class="relative">
    <span class="sr-only">Szukaj</span>
    <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.2-5.2M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
    <input name="q" value="{{ q }}" type="search" placeholder="Imię, nazwisko lub zawód" class="w-full rounded-xl border-slate-300 pl-9 focus:border-red-500 focus:ring-red-500">
  </label>
  <select name="club" class="rounded-xl border-slate-300 focus:border-red-500 focus:ring-red-500" aria-label="Klub">
    <option value="">Wszystkie kluby</option>
    {% for c in clubs %}<option value="{{ c.code }}" {% if club == c.code %}selected{% endif %}>{{ c.code }} ({{ c.members_count }})</option>{% endfor %}
  </select>
  <select name="district" class="rounded-xl border-slate-300 focus:border-red-500 focus:ring-red-500" aria-label="Okręg">
    <option value="">Wszystkie okręgi</option>
    {% for num, name in districts %}<option value="{{ num }}" {% if district == num|stringformat:"d" %}selected{% endif %}>{{ num }}. {{ name }}</option>{% endfor %}
  </select>
  <label class="inline-flex items-center gap-2 text-sm text-slate-600 whitespace-nowrap">
    <input type="checkbox" name="former" value="1" {% if show_former %}checked{% endif %} class="rounded border-slate-300 text-red-600 focus:ring-red-500">
    Także byli posłowie
  </label>
</form>

<div id="results" class="htmx-fade mt-6">
  {% include "mps/_results.html" %}
</div>
{% endblock %}
